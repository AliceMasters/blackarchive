name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Smoke tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ '22', '24' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: for f in server.js db.js scripts/*.js music/*.js music/public/app.js; do node --check "$f"; done
      - name: Smoke tests
        run: npm test
